<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Kit - Multiplayer Servers</title>
    <style>
        /* --- CORE STYLES --- */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111;
            overflow: hidden;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* --- ROBLOX DISCONNECT PRANK UI --- */
        #roblox-disconnect {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000;
            justify-content: center; align-items: center; flex-direction: column;
            pointer-events: auto;
        }
        .rd-box {
            background-color: #393B3D; border-radius: 8px; width: 400px; max-width: 85%;
            padding: 30px; text-align: center; border: 1px solid #4F5459;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .rd-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #FFF; }
        .rd-msg { font-size: 16px; color: #BDBDBD; margin-bottom: 30px; line-height: 1.5; }
        .rd-btn-container { display: flex; gap: 10px; justify-content: center; }
        .rd-btn {
            flex: 1; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 4px; cursor: pointer; border: none;
        }
        .rd-leave { background: transparent; color: #FFF; border: 1px solid #BDBDBD; }
        .rd-reconnect { background: #FFF; color: #393B3D; }

        /* --- SERVER BROWSER / JOIN CODE MODAL --- */
        #server-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 9000;
            justify-content: center; align-items: center;
        }
        .srv-box {
            background: #232527; border: 1px solid #4F5459; border-radius: 12px;
            width: 380px; max-width: 90%; padding: 24px; color: #fff;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
        }
        .srv-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 20px; font-weight: bold; margin-bottom: 18px;
            border-bottom: 1px solid #393B3D; padding-bottom: 10px;
        }
        .srv-close {
            background: transparent; border: none; color: #aaa;
            font-size: 22px; cursor: pointer; font-weight: bold;
        }
        .srv-close:hover { color: #fff; }
        .srv-section { margin-bottom: 18px; }
        .srv-label { font-size: 13px; color: #aaa; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .srv-action-btn {
            width: 100%; padding: 11px; font-size: 15px; font-weight: bold;
            border-radius: 6px; border: none; cursor: pointer; margin-bottom: 10px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .srv-action-btn:active { transform: scale(0.98); }
        .btn-public { background: #00b06f; color: #fff; }
        .btn-create { background: #3498db; color: #fff; }
        .srv-join-row { display: flex; gap: 8px; }
        #join-code-input {
            flex: 1; background: #111214; border: 1px solid #4F5459; color: #fff;
            padding: 10px 12px; border-radius: 6px; font-size: 15px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold; outline: none;
        }
        .btn-join-code {
            background: #f1c40f; color: #111; font-weight: bold; border: none;
            padding: 0 18px; border-radius: 6px; cursor: pointer; font-size: 15px;
        }
        #srv-status-msg {
            font-size: 13px; color: #00ff9d; text-align: center; min-height: 18px; margin-top: 6px;
        }

        /* --- GAME UI ELEMENTS --- */
        #top-logo {
            position: absolute; top: 20px; left: 20px; width: 52px; height: 52px;
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.8);
            z-index: 100; cursor: pointer; background: #222; object-fit: cover;
        }
        #top-logo:active { transform: scale(0.9); }

        /* --- PLAYER & SERVER HUD (TOP RIGHT) --- */
        #hud-bar {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            background: rgba(20, 22, 25, 0.88); padding: 8px 12px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); color: #fff; max-width: calc(100vw - 110px);
        }
        #username-input {
            background: #2c3035; border: 1px solid #555; color: #fff;
            padding: 6px 10px; border-radius: 6px; font-size: 14px; width: 110px;
            outline: none;
        }
        #avatar-select {
            background: #2c3035; border: 1px solid #555; color: #fff;
            padding: 6px 8px; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
        #server-badge {
            background: #1e272e; border: 1px solid #00d2d3; color: #00d2d3;
            padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: bold;
            cursor: pointer; title: "Click to copy server code";
        }
        #open-server-btn {
            background: #3498db; border: none; color: #fff;
            padding: 6px 12px; border-radius: 6px; font-size: 13px;
            font-weight: bold; cursor: pointer;
        }
        #online-count {
            font-size: 13px; color: #2ecc71; font-weight: bold; margin-left: 2px;
        }

        #gameCanvas {
            background: #1e272e;
            width: 100%; height: 100%; display: block;
        }

        /* --- JOYSTICK --- */
        #joy-base {
            position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px;
            background: rgba(0, 0, 0, 0.5); border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; z-index: 50; display: flex; justify-content: center; align-items: center;
        }
        #joy-stick {
            width: 60px; height: 60px; background: rgba(255, 255, 255, 0.9);
            border-radius: 50%; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Prank Disconnect Modal -->
    <div id="roblox-disconnect">
        <div class="rd-box">
            <div class="rd-title">Disconnected</div>
            <div class="rd-msg">Please check your internet connection and try again.<br><br>(Error Code: 277)</div>
            <div class="rd-btn-container">
                <button class="rd-btn rd-leave" onclick="window.location.href='https://www.roblox.com/home'">Leave</button>
                <button class="rd-btn rd-reconnect" onclick="document.getElementById('roblox-disconnect').style.display='none'">Reconnect</button>
            </div>
        </div>
    </div>

    <!-- Server Manager Modal (Public / Create / Join by Code) -->
    <div id="server-modal">
        <div class="srv-box">
            <div class="srv-header">
                <span>Server Manager</span>
                <button class="srv-close" id="close-server-btn">&times;</button>
            </div>

            <div class="srv-section">
                <span class="srv-label">Quick Matchmaking</span>
                <button class="srv-action-btn btn-public" id="join-public-btn">🌐 Join Public Server</button>
                <button class="srv-action-btn btn-create" id="create-server-btn">➕ Create Private Server</button>
            </div>

            <div class="srv-section">
                <span class="srv-label">Join Server by Code</span>
                <div class="srv-join-row">
                    <input type="text" id="join-code-input" maxlength="8" placeholder="ENTER CODE">
                    <button class="btn-join-code" id="join-code-btn">Join</button>
                </div>
            </div>

            <div id="srv-status-msg"></div>
        </div>
    </div>

    <!-- Main Game Container -->
    <div id="game-container" style="width: 100%; height: 100%; position: relative;">
        
        <img src="https://i.imghippo.com/files/FsM9340oIE.jpeg" id="top-logo" alt="Logo">

        <!-- Live Username, Avatar & Server Switcher -->
        <div id="hud-bar">
            <input type="text" id="username-input" maxlength="16" placeholder="Username">
            <select id="avatar-select">
                <option value="0">Bacon Hair</option>
                <option value="1">Cyber Ninja</option>
                <option value="2">Dominus King</option>
                <option value="3">Inferno Demon</option>
                <option value="4">Neon Valkyrie</option>
            </select>
            <span id="server-badge" title="Click to copy server code">🌐 PUBLIC</span>
            <button id="open-server-btn">Servers</button>
            <span id="online-count">● 1 Online</span>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div id="joy-base"><div id="joy-stick"></div></div>
    </div>

    <!-- Connect External JS File -->
    <script src="game.js"></script>
</body>
</html>
